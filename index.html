<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>35 MM - Cinema. Rated.</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    :root { --bg: #050505; --surface: #121212; --primary: #FFD700; --text: #ffffff; }
    body { margin: 0; background-color: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    * { box-sizing: border-box; }
    
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    .nav-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 15px; font-weight: 600; transition: 0.2s; }
    .nav-btn:hover { color: #fff; }

    .search-bar { padding: 10px 15px; border-radius: 20px; border: 1px solid #333; background: rgba(0,0,0,0.5); color: white; width: 250px; outline: none; transition: 0.3s; }
    .search-bar:focus { border-color: var(--primary); width: 300px; background: rgba(0,0,0,0.8); }

    .media-row { display: flex; gap: 15px; overflow-x: auto; padding: 10px 5%; scroll-snap-type: x mandatory; padding-bottom: 20px; }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px 5%; }
    .media-card { flex: 0 0 200px; scroll-snap-align: start; background: #111; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid #222; position: relative; transition: transform 0.3s; }
    .media-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.8); border-color: #444; z-index: 10; }
    .media-card img { width: 100%; height: 300px; object-fit: cover; }

    .hero-banner { position: relative; width: 100%; height: 75vh; background-size: cover; background-position: center; display: flex; align-items: flex-end; }
    .hero-gradient { position: absolute; inset: 0; background: linear-gradient(to top, #050505 5%, rgba(5,5,5,0.8) 30%, transparent 100%); }
    .hero-content { position: relative; z-index: 2; padding: 50px 5%; max-width: 800px; }

    .episode-card { display: flex; gap: 15px; background: #111; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #222; align-items: center; }
    .episode-card img { width: 120px; height: 70px; object-fit: cover; border-radius: 8px; }

    .trailer-btn { display: inline-flex; align-items: center; gap: 10px; padding: 15px 30px; background: #fff; color: #000; text-decoration: none; font-weight: 900; border-radius: 8px; font-size: 16px; transition: 0.2s; border: none; cursor: pointer; }
    .trailer-btn:hover { background: #FFD700; transform: scale(1.05); }

    /* Cast & Crew Styles */
    .cast-row { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; }
    .cast-card { flex: 0 0 120px; text-align: center; cursor: pointer; transition: 0.3s; }
    .cast-card:hover { transform: translateY(-5px); }
    .cast-card img { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 2px solid #333; margin-bottom: 10px; }
    .cast-card h4 { margin: 0; font-size: 14px; color: #fff; }
    .cast-card p { margin: 5px 0 0 0; font-size: 12px; color: #aaa; }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .search-bar { width: 160px; }
      .search-bar:focus { width: 220px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_KEY = "7b9a12af809f78ea58b825ed3090934a";
    const BASE_URL = "https://api.themoviedb.org/3";
    const IMG_URL = "https://image.tmdb.org/t/p/w500";
    const BACKDROP_URL = "https://image.tmdb.org/t/p/original";
    const PROFILE_URL = "https://image.tmdb.org/t/p/w185";

    const getRatingData = (score) => {
      const num = parseFloat(score);
      if (num >= 9.5) return { cat: 'ABSOLUTE CINEMA', col: '#FFD700', bg: 'rgba(255, 215, 0, 0.15)' };
      if (num >= 9.0) return { cat: 'PERFECT', col: '#00BFFF', bg: 'rgba(0, 191, 255, 0.15)' };
      if (num >= 7.5) return { cat: 'QUALITY', col: '#32CD32', bg: 'rgba(50, 205, 50, 0.15)' };
      if (num >= 6.0) return { cat: 'WORTH IT', col: '#006400', bg: 'rgba(0, 100, 0, 0.15)' };
      if (num >= 5.0) return { cat: 'NOT WORTH IT', col: '#FF69B4', bg: 'rgba(255, 105, 180, 0.15)' };
      return { cat: 'ABSOLUTE TRASH', col: '#FF0000', bg: 'rgba(255, 0, 0, 0.15)' };
    };

    const getMockAward = (rating) => {
      const num = parseFloat(rating);
      if (num >= 9.0) return "🏆 Winner of Multiple Global Awards & Academy Favourites";
      if (num >= 8.0) return "🌟 Critically Acclaimed Masterpiece";
      if (num >= 7.0) return "🎖️ Official Selection & Fan Favourite";
      return "";
    };

    const formatData = (item, type) => {
      let finalType = item.media_type || type;
      if (finalType === 'tv') finalType = 'series'; 
      return {
        id: item.id,
        title: item.title || item.name,
        year: (item.release_date || item.first_air_date || 'N/A').substring(0, 4),
        rating: item.vote_average ? item.vote_average.toFixed(1) : '0.0',
        image: item.poster_path ? IMG_URL + item.poster_path : 'https://via.placeholder.com/500x750?text=No+Poster',
        backdrop: item.backdrop_path ? BACKDROP_URL + item.backdrop_path : '',
        synopsis: item.overview || 'No synopsis available.',
        type: finalType
      };
    };

    function App() {
      const [route, setRoute] = useState('/');
      const [selectedItem, setSelectedItem] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      
      const [trendingMovies, setTrendingMovies] = useState([]);
      const [trendingSeries, setTrendingSeries] = useState([]);
      const [topRated, setTopRated] = useState([]);
      const [heroItem, setHeroItem] = useState(null);

      const nav = (path, item = null) => { 
        setRoute(path); 
        setSelectedItem(item); 
        setSearchQuery(''); 
        window.scrollTo(0, 0); 
      };

      useEffect(() => {
        fetch(`${BASE_URL}/trending/movie/day?api_key=${API_KEY}`)
          .then(r => r.json())
          .then(data => {
            const formatted = data.results.map(m => formatData(m, 'movie'));
            setTrendingMovies(formatted);
            setHeroItem(formatted[0]); 
          });

        fetch(`${BASE_URL}/trending/tv/day?api_key=${API_KEY}`)
          .then(r => r.json())
          .then(data => setTrendingSeries(data.results.map(s => formatData(s, 'series'))));

        fetch(`${BASE_URL}/movie/top_rated?api_key=${API_KEY}`)
          .then(r => r.json())
          .then(data => setTopRated(data.results.map(m => formatData(m, 'movie'))));
      }, []);

      const handleSearch = (e) => {
        const query = e.target.value;
        setSearchQuery(query);
        if (query.length > 2) {
          fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${query}`)
            .then(r => r.json())
            .then(data => {
              const filtered = data.results.filter(i => i.media_type === 'movie' || i.media_type === 'tv');
              setSearchResults(filtered.map(item => formatData(item, item.media_type)));
            });
        } else {
          setSearchResults([]);
        }
      };

      // Component: HERO BANNER
      const HeroBanner = () => {
        if (!heroItem) return <div className="hero-banner"></div>;
        const r = getRatingData(heroItem.rating);
        return (
          <div className="hero-banner" style={{ backgroundImage: `url(${heroItem.backdrop || heroItem.image})` }}>
            <div className="hero-gradient"></div>
            <div className="hero-content">
              <div style={{ display: 'inline-block', padding: '5px 12px', border: `1px solid ${r.col}`, background: r.bg, borderRadius: '4px', color: r.col, fontWeight: 'bold', fontSize: '14px', marginBottom: '15px' }}>
                {heroItem.rating} • {r.cat}
              </div>
              <h1 style={{ fontSize: '48px', margin: '0 0 15px 0', fontWeight: '900', textShadow: '2px 2px 10px rgba(0,0,0,0.8)' }}>{heroItem.title}</h1>
              <p style={{ fontSize: '16px', lineHeight: '1.6', color: '#ddd', textShadow: '1px 1px 5px rgba(0,0,0,0.8)', maxWidth: '600px' }}>{heroItem.synopsis.substring(0, 150)}...</p>
              <div style={{ marginTop: '20px' }}>
                <button onClick={() => nav('/detail', heroItem)} style={{ padding: '12px 30px', background: '#FFD700', color: '#000', border: 'none', borderRadius: '8px', fontSize: '16px', fontWeight: 'bold', cursor: 'pointer' }}>▶ View Details</button>
              </div>
            </div>
          </div>
        );
      };

      // Component: HORIZONTAL SCROLL ROW
      const MediaRow = ({ title, items }) => (
        <div style={{ marginTop: '20px' }}>
          <h2 style={{ fontSize: '24px', margin: '0 0 15px 5%', fontWeight: '700', borderLeft: '4px solid #FFD700', paddingLeft: '10px' }}>{title}</h2>
          <div className="media-row">
            {items.map(item => {
              const r = getRatingData(item.rating);
              return (
                <div key={item.id} className="media-card" onClick={() => nav('/detail', item)}>
                  <div style={{ position: 'absolute', top: '10px', right: '10px', background: r.bg, border: `1px solid ${r.col}`, color: r.col, padding: '4px 8px', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', zIndex: 2, backdropFilter: 'blur(5px)' }}>
                    {item.rating}
                  </div>
                  <img src={item.image} alt={item.title} />
                  <div style={{ padding: '15px' }}>
                    <h3 style={{ margin: '0 0 5px 0', fontSize: '15px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.title}</h3>
                    <p style={{ margin: 0, color: '#888', fontSize: '12px' }}>{item.year} • {item.type.toUpperCase()}</p>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );

      // Component: PERSON / ACTOR / DIRECTOR DETAILS
      const PersonDetail = ({ personId }) => {
        const [person, setPerson] = useState(null);
        const [credits, setCredits] = useState([]);

        useEffect(() => {
          fetch(`${BASE_URL}/person/${personId}?api_key=${API_KEY}&append_to_response=combined_credits`)
            .then(res => res.json())
            .then(data => {
              setPerson(data);
              // Extract top movies they worked in
              let movies = data.combined_credits?.cast || [];
              if (movies.length === 0) movies = data.combined_credits?.crew || [];
              
              const formatted = movies
                .filter(m => m.poster_path)
                .sort((a,b) => b.vote_average - a.vote_average)
                .slice(0, 15)
                .map(m => formatData(m, m.media_type));
                
              setCredits(formatted);
            });
        }, [personId]);

        if (!person) return <div style={{padding: '100px 5%', color: '#fff'}}>Loading Profile...</div>;

        return (
          <div style={{ padding: '100px 5% 40px', maxWidth: '1200px', margin: '0 auto', minHeight: '80vh' }}>
            <button onClick={() => nav('/')} className="nav-btn" style={{ marginBottom: '30px', fontSize: '16px' }}>← Back</button>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '40px' }}>
              <img src={person.profile_path ? PROFILE_URL + person.profile_path : 'https://via.placeholder.com/300x450?text=No+Photo'} style={{ width: '100%', maxWidth: '300px', borderRadius: '16px', objectFit: 'cover', boxShadow: '0 20px 40px rgba(0,0,0,0.6)' }} />
              <div style={{ flex: 1, minWidth: '300px' }}>
                <h1 style={{ fontSize: '42px', margin: '0 0 10px 0', fontWeight: '800' }}>{person.name}</h1>
                <p style={{ color: '#FFD700', fontSize: '18px', fontWeight: 'bold' }}>{person.known_for_department}</p>
                <h3 style={{fontSize: '20px', borderBottom: '1px solid #333', paddingBottom: '10px', marginTop: '30px'}}>Biography</h3>
                <p style={{ fontSize: '16px', lineHeight: '1.8', color: '#ccc' }}>{person.biography || "Biography not available."}</p>
              </div>
            </div>
            
            {credits.length > 0 && (
              <div style={{ marginTop: '50px' }}>
                <MediaRow title="Known For (Movies & Series)" items={credits} />
              </div>
            )}
          </div>
        );
      };

      // Component: MOVIE / SERIES DETAILS
      const ItemDetail = ({ item }) => {
        const [episodes, setEpisodes] = useState([]);
        const [trailer, setTrailer] = useState(null);
        const [cast, setCast] = useState([]);
        const [director, setDirector] = useState(null);
        const [details, setDetails] = useState(null);
        const r = getRatingData(item.rating);
        const awardText = getMockAward(item.rating);

        const apiType = item.type === 'series' ? 'tv' : 'movie';

        useEffect(() => {
          fetch(`${BASE_URL}/${apiType}/${item.id}?api_key=${API_KEY}&append_to_response=videos,credits`)
            .then(res => res.json())
            .then(data => {
              setDetails(data);
              // Video
              if (data.videos?.results?.length > 0) {
                const official = data.videos.results.find(v => v.site === 'YouTube' && v.type === 'Trailer') || data.videos.results[0];
                setTrailer(official.key);
              }
              // Cast
              if (data.credits?.cast) {
                setCast(data.credits.cast.slice(0, 10)); // Top 10 actors
              }
              // Director
              if (apiType === 'movie') {
                const dir = data.credits?.crew?.find(c => c.job === 'Director');
                if(dir) setDirector(dir);
              } else {
                const creator = data.created_by?.[0]; // TV uses "created_by"
                if(creator) setDirector(creator);
              }
            });

          if (apiType === 'tv') {
            fetch(`${BASE_URL}/tv/${item.id}/season/1?api_key=${API_KEY}`)
              .then(res => res.json())
              .then(data => { if(data.episodes) setEpisodes(data.episodes); });
          }
        }, [item]);

        return (
          <div style={{ padding: '100px 5% 40px', maxWidth: '1200px', margin: '0 auto', minHeight: '80vh' }}>
            <button onClick={() => nav('/')} className="nav-btn" style={{ marginBottom: '30px', fontSize: '16px' }}>← Back</button>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '40px' }}>
              <img src={item.image} style={{ width: '100%', maxWidth: '350px', borderRadius: '16px', objectFit: 'cover', boxShadow: '0 20px 40px rgba(0,0,0,0.6)' }} />
              <div style={{ flex: 1, minWidth: '300px' }}>
                <h1 style={{ fontSize: '42px', margin: '0 0 10px 0', fontWeight: '800' }}>{item.title}</h1>
                <p style={{ color: '#aaa', fontSize: '18px', marginBottom: '10px' }}>{item.year} • {item.type.toUpperCase()} {details && details.runtime ? `• ${details.runtime} mins` : ''}</p>
                
                {awardText && <p style={{ color: '#FFD700', fontSize: '16px', fontWeight: 'bold', marginBottom: '20px' }}>{awardText}</p>}

                <div style={{ display: 'flex', alignItems: 'center', gap: '20px', marginBottom: '30px', flexWrap: 'wrap' }}>
                  <div style={{ display: 'inline-block', padding: '15px 30px', border: `2px solid ${r.col}`, background: r.bg, borderRadius: '12px' }}>
                    <div style={{ fontSize: '38px', fontWeight: '900', color: r.col, textAlign: 'center', lineHeight: '1' }}>{item.rating}</div>
                    <div style={{ fontSize: '12px', letterSpacing: '2px', color: r.col, fontWeight: '700', marginTop: '10px', textAlign: 'center' }}>{r.cat}</div>
                  </div>
                  
                  {trailer && (
                    <a href={`https://www.youtube.com/watch?v=${trailer}`} target="_blank" rel="noreferrer" className="trailer-btn">
                      ▶ Watch Trailer
                    </a>
                  )}
                </div>
                
                <h3 style={{fontSize: '20px', borderBottom: '1px solid #333', paddingBottom: '10px'}}>Synopsis</h3>
                <p style={{ fontSize: '18px', lineHeight: '1.8', color: '#ccc', marginBottom: '30px' }}>{item.synopsis}</p>

                {/* Director Section */}
                {director && (
                  <div style={{ marginBottom: '30px' }}>
                    <h3 style={{fontSize: '20px', borderBottom: '1px solid #333', paddingBottom: '10px', color: '#FFD700'}}>{item.type === 'movie' ? 'Directed By' : 'Created By'}</h3>
                    <div onClick={() => nav('/person', director.id)} style={{ display: 'inline-flex', alignItems: 'center', gap: '15px', background: '#111', padding: '10px 20px', borderRadius: '12px', border: '1px solid #333', cursor: 'pointer', transition: '0.3s' }} className="cast-card">
                      <img src={director.profile_path ? PROFILE_URL + director.profile_path : 'https://via.placeholder.com/100?text=No+Pic'} style={{ width: '60px', height: '60px', borderRadius: '50%', objectFit: 'cover' }} />
                      <div style={{textAlign: 'left'}}>
                        <h4 style={{ margin: 0, fontSize: '18px', color: '#fff' }}>{director.name}</h4>
                        <p style={{ margin: 0, color: '#aaa', fontSize: '14px' }}>{item.type === 'movie' ? 'Director' : 'Creator'}</p>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* Cast Section */}
            {cast.length > 0 && (
              <div style={{ marginTop: '40px' }}>
                <h3 style={{fontSize: '24px', borderBottom: '1px solid #333', paddingBottom: '10px', color: '#FFD700'}}>Top Cast</h3>
                <div className="cast-row">
                  {cast.map(actor => (
                    <div key={actor.id} className="cast-card" onClick={() => nav('/person', actor.id)}>
                      <img src={actor.profile_path ? PROFILE_URL + actor.profile_path : 'https://via.placeholder.com/100?text=No+Pic'} alt={actor.name} />
                      <h4>{actor.name}</h4>
                      <p>{actor.character}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Episodes */}
            {episodes.length > 0 && (
              <div style={{ marginTop: '40px' }}>
                <h3 style={{fontSize: '24px', borderBottom: '1px solid #333', paddingBottom: '10px', color: '#FFD700'}}>Season 1 Episodes</h3>
                {episodes.map(ep => {
                  const epRating = ep.vote_average ? ep.vote_average.toFixed(1) : '0.0';
                  const epRData = getRatingData(epRating);
                  return (
                    <div key={ep.id} className="episode-card">
                      <img src={ep.still_path ? IMG_URL + ep.still_path : item.image} />
                      <div style={{ flex: 1 }}>
                        <strong style={{ fontSize: '18px' }}>{ep.episode_number}. {ep.name}</strong>
                        <p style={{ fontSize: '14px', color: '#aaa', margin: '5px 0' }}>{(ep.overview || "No description available.").substring(0, 100)}...</p>
                      </div>
                      <div style={{ padding: '8px 15px', border: `1px solid ${epRData.col}`, background: epRData.bg, color: epRData.col, borderRadius: '8px', textAlign: 'center', minWidth: '130px' }}>
                        <div style={{ fontWeight: 'bold', fontSize: '20px' }}>{epRating}</div>
                        <div style={{ fontSize: '10px', letterSpacing: '1px' }}>{epRData.cat}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      };

      // Search and Main Views Setup
      const SearchResults = () => (
        <div style={{ paddingTop: '100px', minHeight: '80vh' }}>
          <h2 style={{ fontSize: '24px', margin: '0 0 15px 5%', fontWeight: '700', borderLeft: '4px solid #FFD700', paddingLeft: '10px' }}>
            Search Results for "{searchQuery}"
          </h2>
          <div className="media-grid">
            {searchResults.map(item => {
              const r = getRatingData(item.rating);
              return (
                <div key={item.id} className="media-card" onClick={() => nav('/detail', item)}>
                  <div style={{ position: 'absolute', top: '10px', right: '10px', background: r.bg, border: `1px solid ${r.col}`, color: r.col, padding: '4px 8px', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', zIndex: 2, backdropFilter: 'blur(5px)' }}>
                    {item.rating}
                  </div>
                  <img src={item.image} alt={item.title} />
                  <div style={{ padding: '15px' }}>
                    <h3 style={{ margin: '0 0 5px 0', fontSize: '15px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.title}</h3>
                    <p style={{ margin: 0, color: '#888', fontSize: '12px' }}>{item.year} • {item.type.toUpperCase()}</p>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );

      let View = () => {
        if (searchQuery.length > 2) return <SearchResults />;
        return (
          <>
            <HeroBanner />
            <div style={{ position: 'relative', zIndex: 10, marginTop: '-50px' }}>
              <MediaRow title="Trending Movies" items={trendingMovies} />
              <MediaRow title="Popular Series" items={trendingSeries} />
              <MediaRow title="Top Rated Masterpieces" items={topRated} />
            </div>
          </>
        );
      };
      
      if(route === '/detail') View = () => <ItemDetail item={selectedItem} />;
      if(route === '/person') View = () => <PersonDetail personId={selectedItem} />;

      return (
        <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
          
          <nav style={{ padding: '20px 5%', background: 'linear-gradient(to bottom, rgba(0,0,0,0.9), transparent)', position: 'absolute', width: '100%', top: 0, zIndex: 100, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ fontSize: '32px', fontWeight: '900', letterSpacing: '3px', cursor: 'pointer', color: '#fff', textShadow: '0 2px 10px rgba(0,0,0,0.8)' }} onClick={() => nav('/')}>
              35<span style={{color: '#FFD700'}}>MM</span>
            </div>
            
            <div style={{ display: 'flex', gap: '20px', alignItems: 'center' }}>
              <input 
                type="text" 
                className="search-bar" 
                placeholder="Search movies, series..." 
                value={searchQuery}
                onChange={handleSearch}
              />
              <div className="nav-links" style={{ display: 'flex', gap: '20px' }}>
                <button onClick={() => nav('/')} className="nav-btn">Home</button>
              </div>
            </div>
          </nav>

          <div style={{ flex: 1 }}>
            <View />
          </div>
          
          <footer style={{ textAlign: 'center', padding: '40px 20px', background: '#050505', borderTop: '1px solid #1a1a1a', marginTop: '40px' }}>
            <h2 style={{ letterSpacing: '3px', margin: '0 0 10px 0', color: '#fff', fontWeight: '900' }}>35<span style={{color: '#FFD700'}}>MM</span></h2>
            <p style={{ color: '#666', fontSize: '14px', margin: '0' }}>Powered by TMDB API • Custom Rated</p>
