<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>35 MM - Cinema. Rated.</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    :root { --bg: #050505; --surface: #121212; --primary: #FFD700; --text: #ffffff; --text-muted: #a0a0a0; }
    body { margin: 0; background-color: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; transition: all 0.2s ease; }
    input, textarea, select { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; margin-bottom: 15px; font-family: inherit; }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); }
    button { cursor: pointer; font-family: inherit; }
    button:active { transform: scale(0.98); }
    
    /* Cinematic Card Hover */
    .movie-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.8); border-color: #444; }
    .movie-card img { transition: transform 0.5s ease; }
    .movie-card:hover img { transform: scale(1.05); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const getRatingData = (score) => {
      const num = parseFloat(score);
      if (num >= 9.5) return { cat: 'ABSOLUTE CINEMA', col: '#FFD700', bg: 'rgba(255, 215, 0, 0.15)' };
      if (num >= 9.0) return { cat: 'PERFECT', col: '#00BFFF', bg: 'rgba(0, 191, 255, 0.15)' };
      if (num >= 7.5) return { cat: 'QUALITY', col: '#32CD32', bg: 'rgba(50, 205, 50, 0.15)' };
      if (num >= 6.0) return { cat: 'WORTH IT', col: '#006400', bg: 'rgba(0, 100, 0, 0.15)' };
      if (num >= 5.0) return { cat: 'NOT WORTH IT', col: '#FF69B4', bg: 'rgba(255, 105, 180, 0.15)' };
      return { cat: 'ABSOLUTE TRASH', col: '#FF0000', bg: 'rgba(255, 0, 0, 0.15)' };
    };

    function App() {
      const [route, setRoute] = useState('/');
      const [selectedItem, setSelectedItem] = useState(null);
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      
      const [movies, setMovies] = useState([
        { id: '1', title: 'The Silent Echo', rating: 9.8, year: 2024, type: 'movie', image: 'https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=800&q=80', synopsis: 'A visual masterpiece exploring sound and silence in a dystopian future.' },
        { id: '2', title: 'Neon Shadows', rating: 7.2, year: 2023, type: 'movie', image: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=800&q=80', synopsis: 'A gritty cyberpunk detective story set in 2084.' },
      ]);
      const [series, setSeries] = useState([
        { id: '101', title: 'Dark Matter', rating: 9.1, year: 2025, type: 'series', image: 'https://images.unsplash.com/photo-1505686994434-e3f942ce5684?auto=format&fit=crop&w=800&q=80', synopsis: 'Space exploration goes terribly wrong when a crew finds an abandoned ship.' },
      ]);

      const nav = (path, item = null) => { setRoute(path); setSelectedItem(item); window.scrollTo(0, 0); };

      const Navbar = () => (
        <nav style={{ padding: '20px 5%', background: 'rgba(5,5,5,0.9)', backdropFilter: 'blur(10px)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #222', position: 'sticky', top: 0, zIndex: 100 }}>
          <div style={{ fontSize: '28px', fontWeight: '900', letterSpacing: '2px', cursor: 'pointer', color: '#fff' }} onClick={() => nav('/')}>
            35<span style={{color: '#FFD700'}}>MM</span>
          </div>
          <div style={{ display: 'flex', gap: '20px', alignItems: 'center' }}>
            <button onClick={() => nav('/')} style={navBtn}>Home</button>
            <button onClick={() => nav('/movies')} style={navBtn}>Movies</button>
            <button onClick={() => nav('/series')} style={navBtn}>Series</button>
            {user ? <button onClick={() => setUser(null)} style={navBtn}>Logout</button> : <button onClick={() => nav('/login')} style={{...navBtn, color: '#FFD700', border: '1px solid #FFD700', padding: '8px 16px', borderRadius: '20px'}}>Login</button>}
            <button onClick={() => nav('/admin-login')} style={{...navBtn, color: '#FF4444'}}>Admin</button>
          </div>
        </nav>
      );

      const MediaGrid = ({ title, items }) => (
        <div style={{ padding: '40px 5%' }}>
          <h2 style={{ fontSize: '28px', marginBottom: '30px', fontWeight: '700', borderLeft: '4px solid #FFD700', paddingLeft: '15px' }}>{title}</h2>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: '25px' }}>
            {items.map(item => {
              const r = getRatingData(item.rating);
              return (
                <div key={item.id} className="movie-card" onClick={() => nav('/detail', item)} style={{ background: '#111', borderRadius: '12px', overflow: 'hidden', cursor: 'pointer', border: '1px solid #222', position: 'relative' }}>
                  <div style={{ position: 'absolute', top: '10px', right: '10px', background: r.bg, border: `1px solid ${r.col}`, color: r.col, padding: '4px 8px', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', zIndex: 2, backdropFilter: 'blur(5px)' }}>
                    {item.rating}
                  </div>
                  <div style={{ overflow: 'hidden', height: '320px' }}>
                    <img src={item.image} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                  </div>
                  <div style={{ padding: '20px' }}>
                    <h3 style={{ margin: '0 0 5px 0', fontSize: '18px', fontWeight: '600' }}>{item.title}</h3>
                    <p style={{ margin: 0, color: '#888', fontSize: '14px' }}>{item.year} • {item.type.toUpperCase()}</p>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );

      const ItemDetail = ({ item }) => {
        const r = getRatingData(item.rating);
        return (
          <div style={{ padding: '40px 5%', maxWidth: '1200px', margin: '0 auto', minHeight: '80vh' }}>
            <button onClick={() => nav('/')} style={{ ...navBtn, marginBottom: '30px', padding: 0 }}>← Back to Browse</button>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '40px' }}>
              <img src={item.image} style={{ width: '100%', maxWidth: '350px', borderRadius: '16px', objectFit: 'cover', boxShadow: '0 20px 40px rgba(0,0,0,0.6)' }} />
              <div style={{ flex: 1, minWidth: '300px' }}>
                <h1 style={{ fontSize: '48px', margin: '0 0 10px 0', fontWeight: '800' }}>{item.title}</h1>
                <p style={{ color: '#aaa', fontSize: '18px', marginBottom: '30px' }}>{item.year} • {item.type.toUpperCase()}</p>
                
                <div style={{ display: 'inline-block', padding: '20px 30px', border: `1px solid ${r.col}`, background: r.bg, borderRadius: '12px', marginBottom: '30px' }}>
                  <div style={{ fontSize: '42px', fontWeight: '900', color: r.col, textAlign: 'center', lineHeight: '1' }}>{item.rating}</div>
                  <div style={{ fontSize: '12px', letterSpacing: '3px', color: r.col, fontWeight: '700', marginTop: '10px' }}>{r.cat}</div>
                </div>
                <h3 style={{fontSize: '20px', borderBottom: '1px solid #333', paddingBottom: '10px'}}>Synopsis</h3>
                <p style={{ fontSize: '18px', lineHeight: '1.8', color: '#ccc' }}>{item.synopsis}</p>
              </div>
            </div>
          </div>
        );
      };

      const AdminLogin = () => {
        const [u, setU] = useState(''); const [p, setP] = useState('');
        return (
          <div style={{ minHeight: '80vh', display: 'flex', justifyContent: 'center', alignItems: 'center' }}>
            <div style={{ background: '#111', padding: '50px', borderRadius: '16px', width: '100%', maxWidth: '400px', border: '1px solid #333', boxShadow: '0 20px 40px rgba(0,0,0,0.8)' }}>
              <h2 style={{ textAlign: 'center', color: '#FF4444', marginBottom: '30px', letterSpacing: '2px' }}>ADMIN CONSOLE</h2>
              <input placeholder="Username" value={u} onChange={e=>setU(e.target.value)} />
              <input type="password" placeholder="Password" value={p} onChange={e=>setP(e.target.value)} />
              <button onClick={() => { if(u==='TANVIR_HOSSAIN' && p==='IMAGINARY_XD786') {setIsAdmin(true); nav('/admin');} else alert('Access Denied'); }} style={{ width: '100%', padding: '15px', background: '#FF4444', color: '#fff', border: 'none', borderRadius: '8px', fontWeight: 'bold', fontSize: '16px', marginTop: '10px' }}>LOGIN</button>
            </div>
          </div>
        );
      };

      const AdminPanel = () => {
        if (!isAdmin) return <h2 style={{textAlign: 'center', marginTop:'100px', color:'red'}}>Denied.</h2>;
        
        const [showForm, setShowForm] = useState(false);
        const [form, setForm] = useState({ id: '', title: '', year: '', rating: '', image: '', type: 'movie', synopsis: '' });

        const openForm = (item = null) => {
          if(item) setForm(item);
          else setForm({ id: '', title: '', year: '', rating: '', image: '', type: 'movie', synopsis: '' });
          setShowForm(true);
        };

        const handleSave = () => {
          if(!form.title || !form.image) return alert("Title and Image required");
          const isNew = !form.id;
          const saveItem = { ...form, id: isNew ? Date.now().toString() : form.id };
          
          if(form.type === 'movie') {
            if(isNew) setMovies([...movies, saveItem]);
            else setMovies(movies.map(m => m.id === saveItem.id ? saveItem : m));
          } else {
            if(isNew) setSeries([...series, saveItem]);
            else setSeries(series.map(s => s.id === saveItem.id ? saveItem : s));
          }
          setShowForm(false);
        };

        const handleDelete = (id, type) => {
          if(confirm("Are you sure you want to delete this?")) {
            if(type === 'movie') setMovies(movies.filter(m => m.id !== id));
            else setSeries(series.filter(s => s.id !== id));
          }
        };

        return (
          <div style={{ padding: '40px 5%', maxWidth: '1000px', margin: '0 auto' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '40px', background: '#111', padding: '20px', borderRadius: '12px', border: '1px solid #333' }}>
              <h2 style={{ margin: 0, color: '#FFD700' }}>Dashboard</h2>
              <button onClick={() => openForm()} style={{ padding: '10px 20px', background: '#FFD700', color: '#000', border: 'none', borderRadius: '8px', fontWeight: 'bold' }}>+ Add New Content</button>
            </div>

            {showForm && (
              <div style={{ background: '#1a1a1a', padding: '30px', borderRadius: '12px', marginBottom: '40px', border: '1px solid #FFD700' }}>
                <h3 style={{ marginTop: 0 }}>{form.id ? 'Edit Content' : 'Add New Content'}</h3>
                <div style={{display: 'flex', gap: '15px'}}>
                  <input placeholder="Title" value={form.title} onChange={e=>setForm({...form, title: e.target.value})} />
                  <input type="number" placeholder="Year" value={form.year} onChange={e=>setForm({...form, year: e.target.value})} />
                </div>
                <div style={{display: 'flex', gap: '15px'}}>
                  <input type="number" step="0.1" placeholder="Rating (0-10)" value={form.rating} onChange={e=>setForm({...form, rating: e.target.value})} />
                  <select value={form.type} onChange={e=>setForm({...form, type: e.target.value})}>
                    <option value="movie">Movie</option>
                    <option value="series">Series</option>
                  </select>
                </div>
                <input placeholder="Image URL (e.g., https://...)" value={form.image} onChange={e=>setForm({...form, image: e.target.value})} />
                <textarea placeholder="Synopsis" rows="3" value={form.synopsis} onChange={e=>setForm({...form, synopsis: e.target.value})}></textarea>
                <div style={{display: 'flex', gap: '10px', justifyContent: 'flex-end'}}>
                  <button onClick={() => setShowForm(false)} style={{ padding: '10px 20px', background: '#333', color: '#fff', border: 'none', borderRadius: '8px' }}>Cancel</button>
                  <button onClick={handleSave} style={{ padding: '10px 20px', background: '#FFD700', color: '#000', border: 'none', borderRadius: '8px', fontWeight: 'bold' }}>Save Content</button>
                </div>
              </div>
            )}

            <h3 style={{ borderBottom: '1px solid #333', paddingBottom: '10px' }}>Manage Library</h3>
            <div style={{ background: '#111', borderRadius: '12px', padding: '10px', border: '1px solid #222' }}>
              {[...movies, ...series].map(item => (
                <div key={item.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '15px', borderBottom: '1px solid #222', alignItems: 'center' }}>
                  <div style={{display: 'flex', alignItems: 'center', gap: '15px'}}>
                    <img src={item.image} style={{width: '50px', height: '70px', objectFit: 'cover', borderRadius: '6px'}} />
                    <div>
                      <strong style={{fontSize: '18px'}}>{item.title}</strong>
                      <div style={{color: '#888', fontSize: '13px'}}>{item.type.toUpperCase()} • Rating: {item.rating}</div>
                    </div>
                  </div>
                  <div style={{display: 'flex', gap: '10px'}}>
                    <button onClick={() => openForm(item)} style={{ padding: '8px 15px', background: '#333', color: '#fff', border: 'none', borderRadius: '6px' }}>Edit</button>
                    <button onClick={() => handleDelete(item.id, item.type)} style={{ padding: '8px 15px', background: '#FF4444', color: '#fff', border: 'none', borderRadius: '6px' }}>Delete</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      const navBtn = { background: 'none', border: 'none', color: '#ccc', cursor: 'pointer', fontSize: '15px', fontWeight: '600' };

      let View = () => <><MediaGrid title="Trending Movies" items={movies} /><MediaGrid title="Popular Series" items={series} /></>;
      if(route === '/movies') View = () => <MediaGrid title="All Movies" items={movies} />;
      if(route === '/series') View = () => <MediaGrid title="All Series" items={series} />;
      if(route === '/detail') View = () => <ItemDetail item={selectedItem} />;
      if(route === '/login') View = () => <div style={{textAlign:'center', marginTop:'100px'}}><h2>User Login Demo</h2><button onClick={()=>{setUser(true);nav('/');}} style={{padding:'10px 20px', background:'#FFD700', color:'#000', border:'none', borderRadius:'20px'}}>Simulate Login</button></div>;
      if(route === '/admin-login') View = AdminLogin;
      if(route === '/admin') View = AdminPanel;

      return (
        <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
          <Navbar />
          <div style={{ flex: 1 }}><View /></div>
          <footer style={{ textAlign: 'center', padding: '40px 20px', background: '#0a0a0a', borderTop: '1px solid #1a1a1a' }}>
            <h2 style={{ letterSpacing: '3px', margin: '0 0 10px 0', color: '#fff', fontWeight: '900' }}>35<span style={{color: '#FFD700'}}>MM</span></h2>
            <p style={{ color: '#666', fontSize: '14px', margin: '0' }}>Cinema. Rated.</p>
            <p style={{ color: '#444', fontSize: '12px', marginTop: '20px' }}>© 2026 TANVIR HOSSAIN. All Rights Reserved.</p>
          </footer>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
